# for more options, see https://docs.rendercv.com/user_guide/yaml_input_structure/design/
# NOTE: RenderCV ignores the design/locale paths in settings.yaml; pass --design and
# --locale-catalog explicitly (render-cv.yml does). See https://github.com/rendercv/rendercv/issues/776
design:
  theme: moderncv
  page:
    size: a4
    top_margin: 1.5cm
    bottom_margin: 1.5cm
    left_margin: 1.5cm
    right_margin: 1.5cm
  typography:
    font_family: Source Sans 3
    font_size:
      body: 10pt
      name: 28pt
  header:
    connections:
      space_between_connections: 0.35cm
  entries:
    date_and_location_width: 2.3cm
    space_between_columns: 0.3cm
  templates:
    date_range: "START_DATE –\nEND_DATE"
    normal_entry:
      main_column: "**NAME** -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    publication_entry:
      main_column: "**TITLE**\nAUTHORS\n*JOURNAL*\nURL"
      date_and_location_column: DATE
