# Upstream fixes from the ISSTA 2025 CodeQL study (study: issta2025), from Aithos, the LLM-agent SAST triage
# framework of the RAID 2026 paper (study: aithos), and manual bug reports not tied to either study (study: other).
# The `studies` table gives the display names.
# kind: patch = a pull request I submitted that was merged; issue = a bug I reported (as an issue or a superseded PR) that maintainers fixed themselves.
# types: CodeQL rule ids (resolved via codeql_rules.yml) or CWE ids (resolved via the cwes table in the same file).
# Only merged PRs (or landed commits, for projects that take patches by mail) and closed-completed issues are included. Generated from the responsible-disclosure spreadsheet,
# plus entries verified against GitHub afterwards (PikaPython pull 337 merged 2024-08-15; tinyusb issue 2502 closed completed 2026-09-08;
# twin issue 84 closed completed 2026-01-03; glfw pull 2327 and netxduo pull 164 closed after maintainers fixed the bugs in their own commits).
# Aithos entries verified 2026-09-08: zstd pull 4238 merged 2025-01-16, pciutils pull 207 merged 2025-06-21, util-linux pull 3615 merged
# 2025-06-16; libidn commit ba07192 (2025-07-09) and xauth merge request 24 (merged 2025-01-29) fix bugs I reported; mawk issue 91 closed completed 2026-01-30.
# Entries added 2026-09-08/09 after auditing all my closed GitHub PRs and issues against this file: some are merged PRs
# missing from the disclosure spreadsheet; others were closed unmerged but the fix still landed via a maintainer's own commit.
# `label` optionally overrides the link text shown on the impact page. `studies` gives `name` (filter dropdown) and `short` (table column).
# For projects that take patches by mail rather than pull requests (openssh, alsa), a patch entry links to the landed commit.
studies:
  issta2025:
    name: "CodeQL study (ISSTA 2025)"
    short: "CodeQL"
  aithos:
    name: "Aithos (RAID 2026)"
    short: "Aithos"
  other:
    name: "Other (manual)"
    short: "Other"
