    Projects:
      - name: Enabling Effective SAST for EDK II UEFI Firmware
        location: Purdue
        start_date: 2025-11
        end_date: 2026-10
        highlights:
          - "Audited EDK II's CodeQL CI deployment and found four issues: an outdated CodeQL version, a misconfigured query suite, the most CVE-prone package excluded from builds, and no alert-triage policy; submitted fixes for the [version](https://github.com/tianocore/edk2/pull/12539) and [build-coverage](https://github.com/tianocore/edk2/pull/12540) issues."
          - "Showed built-in queries catch only 1 of 15 past CVEs at 57.1% precision: they miss firmware untrusted inputs and target common C bug patterns, not EDK II's."
          - "Developed EDK II taint models and queries that catch all 15 CVEs at 84.4% precision, outperforming KNighter (a state-of-the-art static-analysis checker synthesizer, whose checkers are overly specific); found 10 new vulnerabilities, 1 [confirmed and fixed](https://github.com/tianocore/edk2/pull/12765)."

      - name: Automating Collateral Evolution with LLM Agents
        location: Purdue
        start_date: 2026-03
        end_date: present
        highlights:
          - Developing an agentic technique that automatically learns symbolic program-transformation rules to automate collateral evolution in EDK II and the Linux kernel.

      - name: "Aithos: LLM-Agent Triage of Static Analysis Alerts"
        location: Purdue & Dartmouth
        start_date: 2024-06
        end_date: 2026-10
        highlights:
          - Designed an LLM agentic framework that classifies SAST alerts from natural-language guidelines, dynamically retrieving program context through LLVM-based analysis primitives.
          - Added a feedback loop that turns developer corrections into reusable, repository-specific examples.
          - Preserved 97.5% of true positives while filtering 78.0% of false positives across four SAST tools on real-world C/C++ projects, outperforming a state-of-the-art baseline.
          - Uncovered 90 unknown bugs in 28 popular Debian packages; fixes merged in zstd, util-linux, pciutils.

      - name: Detecting 709 Defects in Open-Source Embedded Software with CodeQL
        location: Purdue
        start_date: 2023-03
        end_date: 2024-12
        highlights:
          - Ran CodeQL across 258 GitHub projects; found 709 true defects at a 34% false positive rate, 535 (75%) likely security vulnerabilities (e.g., null pointer dereference, buffer overflow).
          - "Got 376 (53%) defects confirmed by maintainers, mainly by submitting and merging [pull requests](https://github.com/pulls?q=is%3Amerged+is%3Apr+author%3Aszsam) to projects including those by Microsoft, Amazon, and the Apache Foundation; 2 CVEs issued."
          - Opened pull requests adding CodeQL scans to CI pipelines; 37 (71% of active repositories) merged.

      - name: Detecting Layering Violations in Embedded Systems
        location: Purdue
        start_date: 2022-07
        end_date: 2023-03
        highlights:
          - Developed an LLVM-based static analysis tool to detect MMIO accesses bypassing the HAL.
          - Analyzed 988 applications across 5 RTOSes; identified 369 violations.

