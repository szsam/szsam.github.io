    Projects:
      - name: LLM Agents for Static Analysis of EDK2 UEFI Firmware
        location: Purdue
        start_date: 2025-01
        end_date: present
        highlights:
          - Building LLM agents that generate EDK2-specific CodeQL queries for UEFI vulnerability discovery.
          - Learning symbolic program-transformation rules to automate collateral evolution across EDK2.

      - name: "Aithos: LLM-Agent Triage of Static Analysis Alerts"
        location: Purdue & Dartmouth
        start_date: 2024-06
        end_date: 2026-10
        highlights:
          - Designed an LLM agentic framework that classifies SAST alerts from natural-language guidelines, dynamically retrieving program context through LLVM-based analysis primitives.
          - Added a feedback loop that turns developer corrections into reusable, repository-specific examples.
          - Preserved 97.5% of true positives while filtering 78.0% of false positives across four SAST tools on real-world C/C++ projects, outperforming a state-of-the-art baseline.
          - Uncovered 90 unknown bugs in 28 popular Debian packages; fixes merged in zstd, util-linux, pciutils.

      - name: Detecting 709 Defects in Open-Source Embedded Software with CodeQL
        location: Purdue
        start_date: 2023-03
        end_date: 2024-12
        highlights:
          - Ran CodeQL across 258 GitHub projects; found 709 true defects at a 34% false positive rate, 535 (75%) likely security vulnerabilities (e.g., null pointer dereference, buffer overflow).
          - "Got 376 (53%) defects confirmed by maintainers, mainly by submitting and merging [pull requests](https://github.com/pulls?q=is%3Amerged+is%3Apr+author%3Aszsam) to projects including those by Microsoft, Amazon, and the Apache Foundation; 2 CVEs issued."
          - Opened pull requests adding CodeQL scans to CI pipelines; 37 (71% of active repositories) merged.

      - name: Detecting Layering Violations in Embedded Systems
        location: Purdue
        start_date: 2022-07
        end_date: 2023-03
        highlights:
          - Developed a static analysis tool to detect MMIO accesses bypassing the HAL.
          - Analyzed 988 applications across 5 RTOSes; identified 369 violations.

