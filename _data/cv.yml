    Summary:
      - bullet: "PhD student in ECE at Purdue working on software security, static program analysis, and AI for software engineering. Built Aithos, a tool-augmented LLM-agent framework that filters 78% of SAST false positives while keeping 97.5% of true positives (RAID 2026); applied CodeQL to 258 open-source embedded projects, finding 709 defects (ISSTA 2025); currently building LLM agents that synthesize CodeQL queries and program-transformation rules for EDK2 UEFI firmware. Over 100 of my patches have been [merged upstream](https://szsam.github.io/impact/) into projects including Apache NuttX, Contiki-NG, Mbed OS, RIOT, SDL, zstd, and util-linux. Seeking full-time software security or systems engineering roles in industry."

