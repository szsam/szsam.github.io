    Summary:
      - bullet: "PhD student in ECE at Purdue working on software security, static program analysis, and AI for software engineering. Built Aithos, a tool-augmented LLM-agent framework that filters 78% of SAST false positives while keeping 97.5% of true positives (RAID 2026); applied CodeQL to 258 open-source embedded projects, finding 709 defects (ISSTA 2025); wrote CodeQL queries for EDK II UEFI firmware that catch all 15 past CVEs and found 10 new vulnerabilities; currently developing an agentic technique that automatically learns program-transformation rules for EDK II and Linux. Over 100 of my patches have been [merged upstream](https://szsam.github.io/impact/) into projects including Apache NuttX, Contiki-NG, Mbed OS, RIOT, SDL, zstd, and util-linux. Seeking full-time software security or systems engineering roles in industry."

