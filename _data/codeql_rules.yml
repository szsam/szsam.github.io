# CodeQL C/C++ rules referenced in merged_patches.yml, with human-readable names and CWE ids.
# Names and CWE tags come from the query metadata in github/codeql (cpp/ql/src).
# Descendants of CWE-119 in the CWE Research View (view 1000) are normalized to CWE-119:
# CWE-120, CWE-121, CWE-122, CWE-123, CWE-124, CWE-125, CWE-126, CWE-127, CWE-130, CWE-466, CWE-785, CWE-786, CWE-787, CWE-788, CWE-805, CWE-806, CWE-822, CWE-823, CWE-824, CWE-825.
# CWE-415 (double free) and CWE-416 (use after free) are kept distinct: they reach CWE-119 only via CWE-825,
# and their primary lineage is CWE-672 (operation on a resource after expiration or release).
# `primary` is the CWE shown as the bug type on the impact page (chosen by hand for multi-CWE rules, favoring
# the concrete consequence over the cause; CWE-762 for new-array-delete-mismatch is assigned by hand since CodeQL has no tag);
# `short` is its display name. Rules without a CWE fall back to `name`.
# A fix may also list a CWE id directly as its type (for bugs not found by a CodeQL rule); those resolve via `cwes`.
cwes:
  CWE-119:
    short: "Buffer overflow"
    name: "Improper restriction of operations within the bounds of a memory buffer"
  CWE-772:
    short: "Resource leak"
    name: "Missing release of resource after effective lifetime"
rules:
